<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Add New Resident</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#137fec",
                        "primary-content": "#ffffff",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101922",
                    },
                    fontFamily: {
                        "display": ["Public Sans", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        /* Remove default scrollbar for cleaner mobile look */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-slate-100 min-h-screen flex justify-center">
<!-- Mobile Container -->
<div class="w-full max-w-md bg-white dark:bg-slate-900 min-h-screen relative flex flex-col shadow-xl mx-auto">
<!-- Header -->
<header class="sticky top-0 z-10 bg-white/90 dark:bg-slate-900/90 backdrop-blur-md border-b border-slate-200 dark:border-slate-800 px-4 py-3 flex items-center justify-between">
<button class="flex items-center justify-center p-2 -ml-2 rounded-full text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
<span class="material-symbols-outlined text-2xl">arrow_back_ios_new</span>
</button>
<h1 class="text-lg font-bold text-center flex-1 pr-8 text-slate-900 dark:text-white">Add New Resident</h1>
</header>
<!-- Main Form Content -->
<main class="flex-1 overflow-y-auto no-scrollbar pb-24">
<form class="flex flex-col gap-6 px-5 py-6">
<!-- Section 1: Identity -->
<div class="space-y-4">
<h2 class="text-sm font-semibold uppercase tracking-wider text-primary/80 dark:text-primary/70 mb-2">Identity</h2>
<!-- Full Name -->
<div class="flex flex-col gap-2">
<label class="text-slate-900 dark:text-slate-200 text-sm font-medium">Full Name</label>
<input class="form-input w-full rounded-lg border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white focus:border-primary focus:ring-1 focus:ring-primary h-12 px-4 placeholder:text-slate-400 dark:placeholder:text-slate-500 transition-all" placeholder="ex. John Doe" type="text"/>
</div>
<!-- ID Number -->
<div class="flex flex-col gap-2">
<label class="text-slate-900 dark:text-slate-200 text-sm font-medium">ID Number</label>
<div class="relative">
<span class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400">
<span class="material-symbols-outlined text-[20px]">badge</span>
</span>
<input class="form-input w-full rounded-lg border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white focus:border-primary focus:ring-1 focus:ring-primary h-12 pl-11 pr-4 placeholder:text-slate-400 dark:placeholder:text-slate-500 transition-all" placeholder="Enter national ID" type="text"/>
</div>
</div>
<!-- Date of Birth -->
<div class="flex flex-col gap-2">
<label class="text-slate-900 dark:text-slate-200 text-sm font-medium">Date of Birth</label>
<div class="relative group cursor-pointer">
<input class="form-input w-full rounded-lg border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white focus:border-primary focus:ring-1 focus:ring-primary h-12 px-4 placeholder:text-slate-400 dark:placeholder:text-slate-500 transition-all appearance-none cursor-pointer" type="date"/>
<div class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none group-focus-within:text-primary transition-colors">
<span class="material-symbols-outlined">calendar_today</span>
</div>
</div>
</div>
</div>
<hr class="border-slate-100 dark:border-slate-800"/>
<!-- Section 2: Demographics -->
<div class="space-y-4">
<h2 class="text-sm font-semibold uppercase tracking-wider text-primary/80 dark:text-primary/70 mb-2">Demographics</h2>
<!-- Gender Selection -->
<div class="flex flex-col gap-2">
<label class="text-slate-900 dark:text-slate-200 text-sm font-medium">Gender</label>
<div class="grid grid-cols-3 gap-2 bg-slate-100 dark:bg-slate-800 p-1 rounded-lg">
<label class="cursor-pointer">
<input checked="" class="peer sr-only" name="gender" type="radio" value="Male"/>
<div class="h-10 flex items-center justify-center rounded-md text-sm font-medium text-slate-500 dark:text-slate-400 transition-all peer-checked:bg-white dark:peer-checked:bg-slate-700 peer-checked:text-primary peer-checked:shadow-sm">
                                    Male
                                </div>
</label>
<label class="cursor-pointer">
<input class="peer sr-only" name="gender" type="radio" value="Female"/>
<div class="h-10 flex items-center justify-center rounded-md text-sm font-medium text-slate-500 dark:text-slate-400 transition-all peer-checked:bg-white dark:peer-checked:bg-slate-700 peer-checked:text-primary peer-checked:shadow-sm">
                                    Female
                                </div>
</label>
<label class="cursor-pointer">
<input class="peer sr-only" name="gender" type="radio" value="Other"/>
<div class="h-10 flex items-center justify-center rounded-md text-sm font-medium text-slate-500 dark:text-slate-400 transition-all peer-checked:bg-white dark:peer-checked:bg-slate-700 peer-checked:text-primary peer-checked:shadow-sm">
                                    Other
                                </div>
</label>
</div>
</div>
</div>
<hr class="border-slate-100 dark:border-slate-800"/>
<!-- Section 3: Contact -->
<div class="space-y-4">
<h2 class="text-sm font-semibold uppercase tracking-wider text-primary/80 dark:text-primary/70 mb-2">Contact Info</h2>
<!-- Phone Number -->
<div class="flex flex-col gap-2">
<label class="text-slate-900 dark:text-slate-200 text-sm font-medium">Phone Number</label>
<input class="form-input w-full rounded-lg border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white focus:border-primary focus:ring-1 focus:ring-primary h-12 px-4 placeholder:text-slate-400 dark:placeholder:text-slate-500 transition-all" placeholder="(123) 456-7890" type="tel"/>
</div>
<!-- Address -->
<div class="flex flex-col gap-2">
<label class="text-slate-900 dark:text-slate-200 text-sm font-medium">Address</label>
<textarea class="form-textarea w-full rounded-lg border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 text-slate-900 dark:text-white focus:border-primary focus:ring-1 focus:ring-primary min-h-[100px] p-4 placeholder:text-slate-400 dark:placeholder:text-slate-500 transition-all resize-none" placeholder="Enter full residential address..."></textarea>
</div>
</div>
</form>
</main>
<!-- Sticky Footer Action -->
<div class="sticky bottom-0 left-0 right-0 bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 p-4 pb-8 backdrop-blur-xl bg-opacity-90 dark:bg-opacity-90 z-20">
<button class="w-full bg-primary hover:bg-blue-600 active:bg-blue-700 text-primary-content font-bold h-14 rounded-xl flex items-center justify-center gap-2 transition-all shadow-lg shadow-primary/20">
<span class="material-symbols-outlined">save</span>
<span>Save Resident</span>
</button>
</div>
</div>
<!-- Background Decoration for Desktop Preview -->
<div class="fixed inset-0 -z-10 hidden sm:block bg-slate-100 dark:bg-slate-950" data-alt="Abstract gradient background for desktop preview context" style="background-image: radial-gradient(at 0% 0%, hsla(210,100%,56%,0.1) 0px, transparent 50%), radial-gradient(at 100% 100%, hsla(210,100%,56%,0.1) 0px, transparent 50%);">
</div>
</body></html>
