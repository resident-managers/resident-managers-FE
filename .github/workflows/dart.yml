# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Dart

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions: write-all

    steps:
      - uses: actions/checkout@v4
      - name: Create Tag
        run: | 
          VERSION="v1.0.${{ github.run_number }}" 
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag $VERSION
          git push origin $VERSION

      # Note: This workflow uses the latest stable version of the Dart SDK.
      # You can specify other versions if desired, see documentation here:
      # https://github.com/dart-lang/setup-dart/blob/main/README.md
      # - uses: dart-lang/setup-dart@v1
      - uses: subosito/flutter-action@v2

      - name: Install dependencies
        run: flutter pub get
        
      # Create env
      - name: Create .env from example
        run: |
          echo "GRAPHQL_ENDPOINT=${{ secrets.GRAPHQL_ENDPOINT }}" >> .env


      # Uncomment this step to verify the use of 'dart format' on each commit.
      # - name: Verify formatting
      #   run: dart format --output=none --set-exit-if-changed .

      # Consider passing '--fatal-infos' for slightly stricter analysis.
      - name: Analyze project source
        run: flutter analyze

      # Your project will need to have tests in test/ and a dependency on
      # package:test for this step to succeed. Note that Flutter projects will
      # want to change this to 'flutter test'.
      - name: Run tests
        run: flutter test
        
      - name: Build APK (user)
        run: flutter build apk --release --flavor user -t lib/main.dart

      - name: Build APK (admin)
        run: flutter build apk --release --flavor admin -t lib/main_admin.dart

      - name: Upload APK (user)
        uses: actions/upload-artifact@v4
        with:
          name: app-user-release
          path: build/app/outputs/flutter-apk/app-user-release.apk

      - name: Upload APK (admin)
        uses: actions/upload-artifact@v4
        with:
          name: app-admin-release
          path: build/app/outputs/flutter-apk/app-admin-release.apk
