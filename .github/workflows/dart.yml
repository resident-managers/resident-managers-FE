# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Build & Release

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  create-tag:
    runs-on: ubuntu-latest
    permissions: write-all
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Create Tag
        id: tag
        run: |
          VERSION="v1.0.${{ github.run_number }}"
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag $VERSION || true
          git push origin $VERSION || true
          echo "version=$VERSION" >> $GITHUB_OUTPUT

  build:
    needs: create-tag
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2

      - name: Install dependencies
        run: flutter pub get

      # Create .env from GitHub Environment variable
      - name: Create .env
        run: echo "GRAPHQL_ENDPOINT=${{ vars.GRAPHQL_ENDPOINT }}" >> .env

      # Consider passing '--fatal-infos' for slightly stricter analysis.
      - name: Analyze project source
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build APK (user)
        run: flutter build apk --release --flavor user -t lib/main.dart

      - name: Build APK (admin)
        run: flutter build apk --release --flavor admin -t lib/main_admin.dart

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apk-builds
          path: |
            build/app/outputs/flutter-apk/app-user-release.apk
            build/app/outputs/flutter-apk/app-admin-release.apk

  release:
    needs: [create-tag, build]
    runs-on: ubuntu-latest
    permissions: write-all
    if: github.event_name == 'push'
    steps:
      - name: Download APK artifacts
        uses: actions/download-artifact@v4
        with:
          name: apk-builds

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create ${{ needs.create-tag.outputs.version }} \
            --title "Release ${{ needs.create-tag.outputs.version }}" \
            --notes "Auto-release from CI" \
            --clobber \
            app-user-release.apk \
            app-admin-release.apk
